services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER:-fm01}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Please set a database password in .env}
      POSTGRES_DB: ${DB_NAME:-fm01}
      DB_PORT: ${DB_PORT:-5432}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:${DB_PORT:-5432}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: -p ${DB_PORT:-5432}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-fm01} -p ${DB_PORT:-5432}" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4-alpine
    restart: unless-stopped
    environment:
      _JAVA_OPTIONS: -Xmx512M -Duser.language=en -Duser.country=US
      LAVALINK_PASSWORD: ${LAVALINK_PASSWORD:?Please set a Lavalink password in .env}
      LAVALINK_URI: ${LAVALINK_URI:-http://lavalink:2333}
    volumes:
      - ./application.yml:/opt/Lavalink/application.yml:ro
    ports:
      - "127.0.0.1:2333:2333"
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- --header=\"Authorization: ${LAVALINK_PASSWORD}\" http://localhost:2333/version || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  twilight-proxy:
    image: ghcr.io/twilight-rs/http-proxy:latest
    restart: unless-stopped
    environment:
      DISCORD_TOKEN: ${TOKEN:?Please set a bot token in .env}
    ports:
      - "127.0.0.1:3000:3000"
    profiles:
      - clustered

  bot:
    build: .
    depends_on:
      db:
        condition: service_healthy
      lavalink:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    environment:
      TOKEN: ${TOKEN:?Please set a bot token in .env}
      DEBUG_TOKEN: ${DEBUG_TOKEN}
      DB_PASSWORD: ${DB_PASSWORD:?Please set a database password in .env}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-fm01}
      DB_HOST: ${DB_HOST:-db}
      DB_NAME: ${DB_NAME:-fm01}
      LAVALINK_URI: ${LAVALINK_URI:-http://lavalink:2333}
      LAVALINK_PASSWORD: ${LAVALINK_PASSWORD}
      SENTRY_DSN: ${SENTRY_DSN:-}
      BOT_MODE: ${BOT_MODE:-standalone}
      SHARD_COUNT: ${SHARD_COUNT:-64}
      SHARDS_PER_CLUSTER: ${SHARDS_PER_CLUSTER:-16}
      CLUSTER_ID: ${CLUSTER_ID:-}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_MSG_URL: ${REDIS_MSG_URL:-redis://redis:6379/1}
      DISCORD_PROXY_URL: ${DISCORD_PROXY_URL:-}
    volumes:
      - .:/bot
    command: sh -c "uv run alembic upgrade head && uv run --no-dev main.py"

volumes:
  postgres_data:
